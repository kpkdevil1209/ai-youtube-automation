name: Autonomous AI YouTube Empire

on:
  schedule:
    # Pakistan Standard Time (PKT) ke mutabiq rozana raat theek 2:00 AM chalega
    - cron: '0 21 * * *'
  workflow_dispatch: # Manual button se bhi kisi waqt chala sakte hain

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install --upgrade pip
        pip install google-generativeai gTTS requests google-api-python-client google-auth-httplib2 google-auth-oauthlib

    - name: Step 1 - Run Script Generator
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python generate_script.py

    - name: Step 2 - Run TTS Voiceover Generator
      run: |
        python generate_audio.py

    - name: Step 3 - Commit & Push Assets to Repository
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add uploaded_topics.json current_script.json voiceover.mp3 subtitles.srt
        git commit -m "Auto: Generated new script and voiceover assets [skip ci]" || exit 0
        git push

    - name: Step 4 - Decode YouTube Token
      env:
        YOUTUBE_TOKEN_PICKLE: ${{ secrets.YOUTUBE_TOKEN_PICKLE }}
      run: |
        echo "$YOUTUBE_TOKEN_PICKLE" | base64 -d > token.pickle

    - name: Step 5 - Upload and Schedule for 6:00 PM PKT
      run: |
        python upload.py
