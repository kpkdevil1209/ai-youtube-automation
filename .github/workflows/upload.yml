name: Autonomous YouTube Empire Pipeline

on:
  schedule:
    # Daily at 21:00 UTC = 2:00 AM PKT
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & OpenCV Libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsm6 libxext6

      - name: Install Python Libraries
        run: |
          pip install --upgrade pip
          pip install setuptools wheel six
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2
          pip install edge-tts
          pip install opencv-python-headless pillow numpy yt-dlp

      - name: Install & Start Local Ollama Runner
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull llama3.2:3b

      - name: Step 0 - Pre-Flight Security & Quota Shield
        env:
          YOUTUBE_TOKEN_PICKLE: ${{ secrets.YOUTUBE_TOKEN_PICKLE }}
        run: |
          python empire_safety_shield.py

      - name: Step 1 - Plan Daily Tasks (Randomized Duration & Cadence)
        run: |
          python daily_task_planner.py

      - name: Step 2 - Generate 65-Strategy Hyper-Retention Script
        run: |
          python generate_script.py

      - name: Step 3 - Generate Mobile Human Audio & Tempered Glass Taps
        run: |
          python generate_audio.py

      - name: Step 4 - Transform Free Fire Gameplay (Inpainting & DEVIL-999 Badge)
        run: |
          python transformative_clipper.py

      - name: Step 5 - Upload & Schedule to YouTube (18:00 PKT)
        env:
          YOUTUBE_TOKEN_PICKLE: ${{ secrets.YOUTUBE_TOKEN_PICKLE }}
        run: |
          python upload_video.py

      - name: Step 6 - Launch Live Comment Auto-Reply & Heart Bot
        env:
          YOUTUBE_TOKEN_PICKLE: ${{ secrets.YOUTUBE_TOKEN_PICKLE }}
        run: |
          python comment_reply_bot.py
