name: 100% Autonomous AI YouTube Empire (Kaggle GPU)

on:
  schedule:
    # Rozana raat 2:00 AM PKT (9:00 PM UTC) par automatically chale
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Base Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gTTS kaggle google-api-python-client google-auth-oauthlib google-auth-httplib2 requests

      - name: Step 1 - Generate Script (Meta Llama 3.2 AI)
        run: |
          python generate_script.py

      - name: Step 2 - Generate Voiceover & Subtitles (gTTS)
        run: |
          python generate_audio.py

      - name: Step 3 - Push Audio/Script to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add current_script.json voiceover.mp3 subtitles.srt
          git commit -m "Auto: Update script, voiceover and subtitles [skip ci]" || echo "No changes to commit"
          git push

      - name: Step 4 - Setup Kaggle Credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Step 5 - Trigger Kaggle NVIDIA T4 GPU & Download Video
        run: |
          echo "[*] Pushing render job to Kaggle T4 GPU..."
          kaggle kernels push -p ./kaggle_render
          
          echo "[*] Waiting for Kaggle T4 GPU to render Full AI Video..."
          for i in {1..25}; do
            STATUS=$(kaggle kernels status kpkdevil/ai-video-renderer)
            echo "Attempt $i: $STATUS"
            if echo "$STATUS" | grep -q "complete"; then
              echo "[✓] Kaggle GPU ne video render kar di!"
              break
            fi
            sleep 15
          done

          echo "[*] Downloading final_output.mp4 from Kaggle..."
          kaggle kernels output kpkdevil/ai-video-renderer -p ./
          
          ls -lh final_output.mp4
          echo "[✓] Full AI Video Download Complete!"

      - name: Step 6 - Decode YouTube Token
        env:
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: |
          echo "$YOUTUBE_CLIENT_SECRET" > client_secrets.json

      - name: Step 7 - Upload and Schedule Video for 6:00 PM PKT
        run: |
          python upload_video.py
