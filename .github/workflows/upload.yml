name: DEVIL INSANITY - Autonomous Free Fire Pipeline

on:
  schedule:
    - cron: '0 12 * * *' # 17:00 PKT (18:00 PKT upload se 1 hour pehle ready)
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Fast Syntax Check (1 Second Fail-Fast)
        run: python -m py_compile *.py

      - name: Install Dependencies & FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          pip install -U pip
          pip install -U yt-dlp requests edge-tts google-api-python-client google-auth google-auth-oauthlib kaggle

      - name: Step 0 - Empire Safety Shield Check
        env:
          YOUTUBE_TOKEN_PICKLE: ${{ secrets.YOUTUBE_TOKEN_PICKLE }}
        run: |
          if [ -f empire_safety_shield.py ]; then python empire_safety_shield.py; fi

      - name: Step 1 - Daily Task Planner (Pillars & Schedule)
        run: python daily_task_planner.py

      - name: Step 2 - AI Script (GPT-4o-mini) & 60FPS Real Gameplay Harvester
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_script.py

      - name: Step 3 - Generate Mobile Human Audio & Tempered Glass Taps
        run: python generate_audio.py

      - name: Step 4 - Commit & Push Gameplay & Audio for Kaggle
        run: |
          mkdir -p kaggle_render
          cp -f raw_gameplay.mp4 final_audio.wav current_script.json kaggle_render/ 2>/dev/null || true
          cp -f subtitles.srt subtitles_en.srt kaggle_render/ 2>/dev/null || true
          git config --global user.name "DEVIL Pipeline Bot"
          git config --global user.email "bot@devil-insanity.local"
          git add -A
          git commit -m "Pass gameplay & assets to Kaggle [skip ci]" || echo "Nothing new to commit"
          git push origin main

      - name: Step 5 - Setup Kaggle Credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_JSON: ${{ secrets.KAGGLE_JSON }}
        run: |
          mkdir -p ~/.kaggle
          if [ -n "$KAGGLE_JSON" ]; then
            echo "$KAGGLE_JSON" > ~/.kaggle/kaggle.json
          else
            echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          fi
          chmod 600 ~/.kaggle/kaggle.json

      - name: Step 6 - Kaggle Render (Fast CPU Mode, Zero Fallback)
        run: |
          echo "[*] Pushing kernel to Kaggle..."
          kaggle kernels push -p kaggle_render
          KERNEL_ID=$(python -c "import json; print(json.load(open('kaggle_render/kernel-metadata.json'))['id'])")
          for i in $(seq 1 70); do
            STATUS=$(kaggle kernels status "$KERNEL_ID")
            echo " -> Check #$i: $STATUS"
            if echo "$STATUS" | grep -qi "complete"; then
              echo "[+] Kaggle Render Complete!"
              break
            fi
            if echo "$STATUS" | grep -qi "error\|cancel"; then
              echo "[!] Kaggle Kernel Failed!"
              exit 1
            fi
            sleep 8
          done
          kaggle kernels output "$KERNEL_ID" -p .
          if [ ! -f final_output.mp4 ]; then
            echo "FATAL: final_output.mp4 missing from Kaggle output!"
            exit 1
          fi

      - name: Step 7 - Upload & Schedule to YouTube (18:00 PKT)
        env:
          YOUTUBE_TOKEN_PICKLE: ${{ secrets.YOUTUBE_TOKEN_PICKLE }}
        run: python upload_video.py

      - name: Step 8 - Launch Live Comment Auto-Reply & Heart Bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_TOKEN_PICKLE: ${{ secrets.YOUTUBE_TOKEN_PICKLE }}
        run: python comment_reply_bot.py
