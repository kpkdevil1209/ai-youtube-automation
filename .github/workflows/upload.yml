name: 100% Autonomous AI YouTube Empire (Kaggle GPU)

on:
  schedule:
    # Pakistan Standard Time (PKT) ke mutabiq rozana raat theek 2:00 AM chalega
    - cron: '0 21 * * *'
  workflow_dispatch: # Test karne ke liye manual button

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install --upgrade pip
        pip install google-generativeai gTTS kaggle requests google-api-python-client google-auth-httplib2 google-auth-oauthlib

    - name: Step 1 - Generate Script (Gemini AI)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python generate_script.py

    - name: Step 2 - Generate Voiceover & Subtitles (gTTS)
      run: |
        python generate_audio.py

    - name: Step 3 - Push Audio/Script to GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add uploaded_topics.json current_script.json voiceover.mp3 subtitles.srt
        git diff --staged --quiet || (git commit -m "Auto: Update assets for GPU [skip ci]" && git push)

    # ⭐ YEH RAHA AAPKA KAGGLE CREDENTIALS SETUP STEP ⭐
    - name: Step 4 - Setup Kaggle Credentials
      env:
        KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      run: |
        mkdir -p ~/.kaggle
        echo "$KAGGLE_KEY" > ~/.kaggle/access_token
        echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
        chmod 600 ~/.kaggle/*
             - name: Step 5 - Trigger Kaggle NVIDIA T4 GPU & Download Video
        run: |
          echo "[*] Pushing job to Kaggle GPU..."
          kaggle kernels push -p ./kaggle_render
          
          echo "[*] Waiting for Kaggle T4 GPU to render Full AI Video..."
          # 5 minutes tak har 15 second baad status check karein
          for i in {1..25}; do
            STATUS=$(kaggle kernels status kpkdevil/ai-video-renderer)
            echo "Attempt $i: $STATUS"
            if echo "$STATUS" | grep -q "complete"; then
              echo "[✓] Kaggle GPU ne video render kar di!"
              break
            fi
            sleep 15
          done

          # Output download karein
          echo "[*] Downloading final_output.mp4 from Kaggle..."
          kaggle kernels output kpkdevil/ai-video-renderer -p ./
          
          # Check karein ke video download hui hai ya nahi
          ls -lh final_output.mp4
          echo "[✓] Full AI Video download ho gayi, ready for YouTube upload!"
