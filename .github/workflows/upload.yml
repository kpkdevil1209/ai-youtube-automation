name: Autonomous YouTube Empire Pipeline

on:
  schedule:
    # Daily at 21:00 UTC = 2:00 AM PKT
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & Tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Libraries
        run: |
          pip install --upgrade pip
          pip install setuptools wheel six
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2
          pip install edge-tts kaggle yt-dlp

      - name: Install & Start Local Ollama Runner
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull llama3.2:3b

      - name: Step 0 - Pre-Flight Security & Quota Shield
        env:
          YOUTUBE_TOKEN_PICKLE: ${{ secrets.YOUTUBE_TOKEN_PICKLE }}
        run: |
          python empire_safety_shield.py

      - name: Step 1 - Plan Daily Tasks (28s-34s Duration & Pillars)
        run: |
          python daily_task_planner.py

      - name: Step 2 - Generate 65-Strategy Script & Harvest Gameplay
        run: |
          python generate_script.py

      - name: Step 3 - Generate Mobile Human Audio & Tempered Glass Taps
        run: |
          python generate_audio.py

      - name: Step 4 - Commit & Push Assets for Kaggle GPU
        run: |
          git config --global user.name "DEVIL Pipeline Bot"
          git config --global user.email "bot@devilgaming.ai"
          git add current_script.json final_audio.wav subtitles.srt subtitles_en.srt
          git diff-index --quiet HEAD || git commit -m "Auto-Assets sync for Kaggle GPU [skip ci]"
          git push origin main || echo "No changes to push or branch protected"

      - name: Step 5 - Setup Kaggle Credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Step 6 - Trigger Kaggle GPU & Smart Instant Download
        run: |
          echo "[*] Pushing code to Kaggle GPU Dual T4..."
          kaggle kernels push -p ./kaggle_render/

          echo "[*] Monitoring Kaggle GPU with Smart Instant Polling (Checks every 10s)..."
          RENDER_SUCCESS=false

          for i in {1..40}; do
            RAW_STATUS=$(kaggle kernels status kpkdevil/devil-video-render-engine 2>&1)
            STATUS=$(echo "$RAW_STATUS" | grep -o 'status ".*"' | cut -d'"' -f2)
            echo " -> Kaggle Kernel Status: [$STATUS] (Check #$i)"

            if [ "$STATUS" == "complete" ]; then
              echo "[+] KAGGLE CONFIRMED: Video Render Finished! Immediately grabbing output..."
              kaggle kernels output kpkdevil/devil-video-render-engine -p ./
              
              if [ -f "final_output.mp4" ]; then
                echo "[+] SUCCESS: final_output.mp4 downloaded instantly from Kaggle!"
                RENDER_SUCCESS=true
                break
              else
                echo "[!] Complete signal received but file still downloading, retrying in 5s..."
                sleep 5
                kaggle kernels output kpkdevil/devil-video-render-engine -p ./
                if [ -f "final_output.mp4" ]; then
                  RENDER_SUCCESS=true
                  break
                fi
              fi
            elif [ "$STATUS" == "error" ]; then
              echo "[!] Kaggle GPU reported error!"
              kaggle kernels output kpkdevil/devil-video-render-engine
              break
            fi

            # Check every 10 seconds (ultra-responsive)
            sleep 10
          done

          if [ "$RENDER_SUCCESS" != "true" ]; then
            echo "[!] Kaggle GPU did not produce final_output.mp4 in time. Activating local 60FPS fallback engine..."
            python transformative_clipper.py
          fi

          ls -lh final_output.mp4

      - name: Step 7 - Upload & Schedule to YouTube (18:00 PKT)
        env:
          YOUTUBE_TOKEN_PICKLE: ${{ secrets.YOUTUBE_TOKEN_PICKLE }}
        run: |
          python upload_video.py

      - name: Step 8 - Launch Live Comment Auto-Reply & Heart Bot
        env:
          YOUTUBE_TOKEN_PICKLE: ${{ secrets.YOUTUBE_TOKEN_PICKLE }}
        run: |
          python comment_reply_bot.py
