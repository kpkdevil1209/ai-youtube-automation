name: Automated YouTube Upload

on:
  workflow_dispatch:

jobs:
  upload-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Decode YouTube Token
        env:
          YOUTUBE_TOKEN_PICKLE: ${{ secrets.YOUTUBE_TOKEN_PICKLE }}
        run: |
          echo "$YOUTUBE_TOKEN_PICKLE" | base64 -d > token.pickle

      - name: Generate Real Sample Video
        run: |
          ffmpeg -y -f lavfi -i color=c=blue:s=320x240:d=1 -c:v libx264 -pix_fmt yuv420p sample_video.mp4

      - name: Run Upload Script
        run: |
          python upload.py
