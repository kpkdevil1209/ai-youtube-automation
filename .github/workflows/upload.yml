name: DEVIL INSANITY - Autonomous Free Fire Pipeline

on:
  schedule:
    - cron: '0 12 * * *' # 17:00 PKT (18:00 PKT scheduled upload se pehle ready)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Fast Syntax Check (1 Second Fail-Fast)
        run: python -m py_compile *.py

      - name: Cache Ollama Models (5s Instant Restore)
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ${{ runner.os }}-ollama-llama3.2-1b

      - name: Install Dependencies, FFmpeg & Ollama
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          pip install -U pip
          pip install -U yt-dlp requests edge-tts google-api-python-client google-auth google-auth-oauthlib kaggle
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi

      - name: Step 0 - Empire Safety Shield Check
        env:
          YOUTUBE_TOKEN_PICKLE: ${{ secrets.YOUTUBE_TOKEN_PICKLE }}
        run: |
          if [ -f empire_safety_shield.py ]; then
            python empire_safety_shield.py
          fi

      - name: Step 1 - Daily Task Planner (Pillars & Schedule)
        run: python daily_task_planner.py

      - name: Step 2 - AI Script (Ollama Schema) & 60FPS Real Gameplay Harvester
        run: |
          pip install -q bgutil-ytdlp-pot-provider
          docker run --name bgutil-provider -d --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider || true
          WGCF_URL=$(curl -sSL https://api.github.com/repos/ViRb3/wgcf/releases/latest | python -c "import sys,json; print([a['browser_download_url'] for a in json.load(sys.stdin)['assets'] if 'linux_amd64' in a['name']][0])")
          WIRE_URL=$(curl -sSL https://api.github.com/repos/windtf/wireproxy/releases/latest | python -c "import sys,json; print([a['browser_download_url'] for a in json.load(sys.stdin)['assets'] if 'linux_amd64.tar.gz' in a['name']][0])")
          curl -fSL "$WGCF_URL" -o /tmp/wgcf && chmod +x /tmp/wgcf
          curl -fSL "$WIRE_URL" -o /tmp/wp.tar.gz && tar -xzf /tmp/wp.tar.gz -C /tmp && chmod +x /tmp/wireproxy
          (/tmp/wgcf register --accepted-tos && /tmp/wgcf generate && printf "WGConfig = ./wgcf-profile.conf\n[Socks5]\nBindAddress = 127.0.0.1:1080\n" > /tmp/wireproxy.conf && /tmp/wireproxy -c /tmp/wireproxy.conf >/dev/null 2>&1 & sleep 3) || true
          python generate_script.py
          rm -f wgcf-account.toml wgcf-profile.conf 2>/dev/null || true

      - name: Step 3 - Generate Mobile Human Audio & Tempered Glass Taps
        run: python generate_audio.py

      - name: Step 4 - Commit & Push Gameplay & Audio for Kaggle
        run: |
          mkdir -p kaggle_render
          cp -f raw_gameplay.mp4 final_audio.wav current_script.json kaggle_render/ 2>/dev/null || true
          cp -f subtitles.srt subtitles_en.srt kaggle_render/ 2>/dev/null || true
          git config --global user.name "DEVIL Pipeline Bot"
          git config --global user.email "bot@devil-insanity.local"
          git add -A
          git commit -m "Pass gameplay & assets to Kaggle [skip ci]" || echo "Nothing new to commit"
          git push origin main

      - name: Step 5 - Setup Kaggle Credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_JSON: ${{ secrets.KAGGLE_JSON }}
        run: |
          mkdir -p ~/.kaggle
          if [ -n "$KAGGLE_JSON" ]; then
            echo "$KAGGLE_JSON" > ~/.kaggle/kaggle.json
          else
            echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          fi
          chmod 600 ~/.kaggle/kaggle.json

      - name: Step 6 - Kaggle Render (Fast CPU Mode, Zero Fallback)
        run: |
          pip install -q six python-slugify python-dateutil
          python3 - <<'PY'
          import json, os, re
          cred_path = os.path.expanduser("~/.kaggle/kaggle.json")
          with open(cred_path) as f:
              user = json.load(f)["username"]
          meta_path = "kaggle_render/kernel-metadata.json"
          with open(meta_path) as f:
              meta = json.load(f)
          raw_slug = meta.get("id", f"{user}/devil-insanity-render").split("/")[-1]
          slug = re.sub(r"[^a-z0-9-]+", "-", raw_slug.lower()).strip("-") or "devil-insanity-render"
          meta["id"] = f"{user}/{slug}"
          meta["title"] = slug
          meta["enable_gpu"] = "false"
          with open(meta_path, "w") as f:
              json.dump(meta, f, indent=2)
          print("Kernel metadata synced:", meta["id"], "| title:", meta["title"])
          PY

          set +e
          PUSH_OUT=$(kaggle kernels push -p kaggle_render 2>&1)
          PUSH_RC=$?
          set -e
          echo "$PUSH_OUT"

          if [ $PUSH_RC -ne 0 ] || echo "$PUSH_OUT" | grep -qi "409"; then
            echo "[!] Kaggle slug conflict/rejected. Rotating to fresh unique slug..."
            NEW_SLUG="devil-render-v${{ github.run_number }}-${{ github.run_attempt }}-$(date +%s | tail -c 5)"
            python3 - "$NEW_SLUG" <<'PY'
          import json, os, sys
          new_slug = sys.argv[1]
          with open(os.path.expanduser("~/.kaggle/kaggle.json")) as f:
              user = json.load(f)["username"]
          meta_path = "kaggle_render/kernel-metadata.json"
          with open(meta_path) as f:
              meta = json.load(f)
          meta["id"] = f"{user}/{new_slug}"
          meta["title"] = new_slug
          meta["enable_gpu"] = "false"
          with open(meta_path, "w") as f:
              json.dump(meta, f, indent=2)
          print("Rotated kernel to:", meta["id"])
          PY
            kaggle kernels push -p kaggle_render
          fi

          KERNEL_ID=$(python3 -c 'import json; print(json.load(open("kaggle_render/kernel-metadata.json"))["id"])')
          echo "[*] Polling Kaggle Kernel: $KERNEL_ID"
          for i in $(seq 1 90); do
            STATUS_OUT=$(kaggle kernels status "$KERNEL_ID" 2>&1 || true)
            echo "[$i/90] $STATUS_OUT"
            if echo "$STATUS_OUT" | grep -qi "complete"; then
              break
            fi
            if echo "$STATUS_OUT" | grep -qi "error"; then
              kaggle kernels output "$KERNEL_ID" -p . || true
              exit 1
            fi
            sleep 15
          done
          kaggle kernels output "$KERNEL_ID" -p .
          ls -lh final_output.mp4
          - name: Step 7 - Upload & Schedule to YouTube (18:00 PKT)
        env:
          YOUTUBE_TOKEN_PICKLE: ${{ secrets.YOUTUBE_TOKEN_PICKLE }}
        run: python upload_video.py

      - name: Step 8 - Launch Live Comment Auto-Reply & Heart Bot
        env:
          YOUTUBE_TOKEN_PICKLE: ${{ secrets.YOUTUBE_TOKEN_PICKLE }}
        run: |
          nohup ollama serve >/dev/null 2>&1 &
          sleep 3
          python comment_reply_bot.py
