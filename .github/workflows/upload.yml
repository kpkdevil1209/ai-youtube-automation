name: DEVIL INSANITY - Autonomous Free Fire Pipeline

on:
  schedule:
    - cron: '0 12 * * *' # 17:00 PKT (18:00 PKT scheduled upload se pehle ready)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Deno (For yt-dlp EJS Challenges)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Fast Syntax Check (1 Second Fail-Fast)
        run: python -m py_compile *.py

      - name: Cache Ollama Models (Text + Vision AI)
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ${{ runner.os }}-ollama-llama3.2-1b-qwen2.5vl-3b-v1
          restore-keys: |
            ${{ runner.os }}-ollama-

      - name: Install Dependencies, FFmpeg & Ollama Models
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          pip install -U pip
          pip install -U "yt-dlp[default]" requests edge-tts google-api-python-client google-auth google-auth-oauthlib kaggle bgutil-ytdlp-pot-provider six python-slugify python-dateutil
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          for m in llama3.2:1b qwen2.5vl:3b; do
            if ! ollama list | grep -q "$m"; then
              ok=0
              for r in 1 2 3; do
                if ollama pull "$m"; then
                  ok=1
                  break
                fi
                echo "[!] Pull attempt $r failed for $m, retrying in 8s..."
                sleep 8
              done
              [ "$ok" -eq 1 ] || exit 1
            fi
          done

      - name: Step 0 - Empire Safety Shield Check
        env:
          YOUTUBE_TOKEN_PICKLE: ${{ secrets.YOUTUBE_TOKEN_PICKLE }}
        run: |
          if [ -f empire_safety_shield.py ]; then
            python -u empire_safety_shield.py
          fi

      - name: Step 1 - Agent 1 (Viral Trend Scout) & Daily Task Planner
        env:
          YOUTUBE_TOKEN_PICKLE: ${{ secrets.YOUTUBE_TOKEN_PICKLE }}
        run: |
          pgrep -x ollama >/dev/null || (nohup ollama serve >/tmp/ollama.log 2>&1 & sleep 4)
          if [ -f viral_trend_agent.py ]; then
            python -u viral_trend_agent.py
          fi
          if [ -f daily_task_planner.py ]; then
            python -u daily_task_planner.py
          fi

      - name: Step 2 - Agent 2 & 3 (AI Script, Vision Check & Gameplay Harvester)
        env:
          YOUTUBE_TOKEN_PICKLE: ${{ secrets.YOUTUBE_TOKEN_PICKLE }}
        run: |
          pgrep -x ollama >/dev/null || (nohup ollama serve >/tmp/ollama.log 2>&1 & sleep 4)
          docker run --name bgutil-provider -d --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider || true
          (curl -fSL --max-time 20 "https://github.com/ViRb3/wgcf/releases/download/v2.3.1/wgcf_2.3.1_linux_amd64" -o /tmp/wgcf && chmod +x /tmp/wgcf && curl -fSL --max-time 20 "https://github.com/windtf/wireproxy/releases/latest/download/wireproxy_linux_amd64.tar.gz" -o /tmp/wp.tar.gz && tar -xzf /tmp/wp.tar.gz -C /tmp && chmod +x /tmp/wireproxy && /tmp/wgcf register --accepted-tos && /tmp/wgcf generate && printf "WGConfig = ./wgcf-profile.conf\n[Socks5]\nBindAddress = 127.0.0.1:1080\n" > /tmp/wireproxy.conf && nohup /tmp/wireproxy -c /tmp/wireproxy.conf >/tmp/wp.log 2>&1 </dev/null & sleep 3) || true
          python -u generate_script.py
          rm -f wgcf-account.toml wgcf-profile.conf 2>/dev/null || true

      - name: Step 3 - Agent 4A (Voice, SFX, BGM & Dual Subtitles)
        run: python -u generate_audio.py

      - name: Step 4 - Commit & Push Gameplay, Audio & Visual Hashes
        run: |
          mkdir -p kaggle_render
          cp -f raw_gameplay.mp4 final_audio.wav current_script.json kaggle_render/ 2>/dev/null || true
          cp -f subtitles.srt subtitles_en.srt kaggle_render/ 2>/dev/null || true
          git config --global user.name "DEVIL Pipeline Bot"
          git config --global user.email "bot@devil-insanity.local"
          git add -A
          git commit -m "Pass gameplay & assets to Kaggle [skip ci]" || echo "Nothing new to commit"
          git pull --rebase origin main || true
          git push origin main

      - name: Step 5 - Setup Kaggle Credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_JSON: ${{ secrets.KAGGLE_JSON }}
        run: |
          mkdir -p ~/.kaggle
          if [ -n "$KAGGLE_JSON" ]; then
            echo "$KAGGLE_JSON" > ~/.kaggle/kaggle.json
          else
            echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          fi
          chmod 600 ~/.kaggle/kaggle.json

      - name: Step 6 - Agent 4B (Kaggle Render CPU Mode, Zero Fallback)
        run: |
          rm -rf kaggle_assets && mkdir -p kaggle_assets
          cp -f raw_gameplay.mp4 final_audio.wav current_script.json kaggle_assets/
          cp -f subtitles.srt subtitles_en.srt kaggle_assets/ 2>/dev/null || true
          python3 -c 'import json, os; u=json.load(open(os.path.expanduser("~/.kaggle/kaggle.json")))["username"]; json.dump({"title":"devil-insanity-assets","id":f"{u}/devil-insanity-assets","licenses":[{"name":"CC0-1.0"}]}, open("kaggle_assets/dataset-metadata.json","w"), indent=2)'
          kaggle datasets version -p kaggle_assets -m "Run ${{ github.run_number }}-${{ github.run_attempt }}" --dir-mode zip || kaggle datasets create -p kaggle_assets --dir-mode zip
          echo "[*] Waiting 35s for Kaggle to index fresh assets..."
          sleep 35

          python3 -c 'import json, os, re; u=json.load(open(os.path.expanduser("~/.kaggle/kaggle.json")))["username"]; p="kaggle_render/kernel-metadata.json"; m=json.load(open(p)); s=re.sub(r"[^a-z0-9-]+","-",m.get("id",f"{u}/devil-video-render-engine").split("/")[-1].lower()).strip("-") or "devil-video-render-engine"; m["id"]=f"{u}/{s}"; m["title"]=s; m["enable_gpu"]=False; m["enable_internet"]=True; m["dataset_sources"]=[f"{u}/devil-insanity-assets"]; json.dump(m,open(p,"w"),indent=2); print("Synced:",m["id"],"dataset:",m["dataset_sources"])'
          set +e
          PUSH_OUT=$(kaggle kernels push -p kaggle_render 2>&1)
          PUSH_RC=$?
          set -e
          echo "$PUSH_OUT"
          if [ $PUSH_RC -ne 0 ] || echo "$PUSH_OUT" | grep -qi "409"; then
            echo "[!] Kaggle 409/conflict detected. Rotating to fresh unique slug..."
            NEW_SLUG="devil-render-v${{ github.run_number }}-${{ github.run_attempt }}-$(date +%s | tail -c 5)"
            python3 -c 'import json, os, sys; ns=sys.argv[1]; u=json.load(open(os.path.expanduser("~/.kaggle/kaggle.json")))["username"]; p="kaggle_render/kernel-metadata.json"; m=json.load(open(p)); m["id"]=f"{u}/{ns}"; m["title"]=ns; m["enable_gpu"]=False; m["enable_internet"]=True; m["dataset_sources"]=[f"{u}/devil-insanity-assets"]; json.dump(m,open(p,"w"),indent=2); print("Rotated:",m["id"])' "$NEW_SLUG"
            kaggle kernels push -p kaggle_render
          fi
          KERNEL_ID=$(python3 -c 'import json; print(json.load(open("kaggle_render/kernel-metadata.json"))["id"])')
          echo "[*] Polling Kaggle Kernel: $KERNEL_ID"
          for i in $(seq 1 90); do
            STATUS_OUT=$(kaggle kernels status "$KERNEL_ID" 2>&1 || true)
            echo "[$i/90] $STATUS_OUT"
            if echo "$STATUS_OUT" | grep -qi "complete"; then
              break
            fi
            if echo "$STATUS_OUT" | grep -qi "error"; then
              kaggle kernels output "$KERNEL_ID" -p . || true
              cat *.log 2>/dev/null || true
              exit 1
            fi
            sleep 15
          done
          kaggle kernels output "$KERNEL_ID" -p .
          ls -lh final_output.mp4

      - name: Step 7 - Agent 5 (QA Guard) & Upload to YouTube (18:00 PKT)
        env:
          YOUTUBE_TOKEN_PICKLE: ${{ secrets.YOUTUBE_TOKEN_PICKLE }}
        run: |
          pgrep -x ollama >/dev/null || (nohup ollama serve >/tmp/ollama.log 2>&1 & sleep 4)
          if [ -f qa_guard_agent.py ]; then
            python -u qa_guard_agent.py final_output.mp4
          fi
          python -u upload_video.py

      - name: Step 8 - Agent 6 (Live Comment Auto-Reply & Heart Bot)
        env:
          YOUTUBE_TOKEN_PICKLE: ${{ secrets.YOUTUBE_TOKEN_PICKLE }}
        run: |
          pgrep -x ollama >/dev/null || (nohup ollama serve >/tmp/ollama.log 2>&1 & sleep 4)
          python -u comment_reply_bot.py
